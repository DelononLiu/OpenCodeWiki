server:
  host: "0.0.0.0"
  port: 8100

llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  max_tokens: 4096
  temperature: 0.1

embedding:
  provider: "openai"
  api_key: "${EMBEDDING_API_KEY}"
  base_url: "https://api.openai.com/v1"
  model: "text-embedding-3-small"
  dimensions: 1536

database:
  path: "./data"

knowledge:
  chunk_size: 512
  chunk_overlap: 50
  max_file_size_mb: 20

retrieval:
  vector_top_k: 20
  keyword_top_k: 10
  rerank_top_k: 5
  rrf_k: 60

prompts:
  dir: "./backend/prompts"
