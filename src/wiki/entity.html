<!-- Entity header -->
<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
  <span style="font-size:24px;font-weight:700">{{NAME}}</span>
  <span style="font-size:11px;padding:2px 10px;border-radius:10px;font-weight:500;background:{{STATUS_BG}};color:{{STATUS_COLOR}}">{{STATUS}}</span>
</div>
<p style="font-size:15px;color:var(--text-muted);margin-bottom:20px">{{DEFINITION}}</p>

{{FILES}}

{{CONTENT}}

<!-- QA section -->
<div style="border-top:1px solid var(--border);padding-top:20px;margin-top:20px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <span style="font-size:15px;font-weight:600">💬 关联问答</span>
    <span style="font-size:10px;padding:2px 8px;background:var(--primary-soft);color:var(--primary);border-radius:8px">{{QA_COUNT}} 个问题</span>
  </div>
  <div id="entityQaList">加载中...</div>
</div>

<script>
async function loadEntityQa() {
  const slug = '{{SLUG}}';
  try {
    const r = await fetch('/api/wiki/entities/' + slug + '/qa');
    const data = await r.json();
    const list = document.getElementById('entityQaList');
    if (!data.qa || data.qa.length === 0) {
      list.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">暂无关联问题</span>';
      return;
    }
    list.innerHTML = data.qa.map(function(q) {
      const badge = q.isCalibrated
        ? '<span style="font-size:9px;padding:1px 8px;background:#ecfdf5;color:#059669;border-radius:8px;margin-left:auto">已校准 ✅</span>'
        : '<span style="font-size:9px;padding:1px 8px;background:#fef3c7;color:#92400e;border-radius:8px;margin-left:auto">待校准 ⏳</span>';
      const answer = q.answer || '';
      const summary = answer.slice(0, 80);
      const expandHtml = summary
        ? '<div style="font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:4px">' + summary + '... <span style="color:var(--primary);cursor:pointer" onclick="this.parentElement.nextElementSibling.style.display=\'block\'">[点击展开]</span></div><div style="display:none;font-size:13px;color:#475569;line-height:1.7;margin-top:8px">' + answer + '</div>'
        : '';
      return '<div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px">' +
        '<div style="display:flex;align-items:center;gap:6px">' +
        '<span style="font-size:11px;font-weight:600;color:var(--primary)">#Q' + q.qid + '</span>' +
        '<span style="font-size:13px;font-weight:500">' + q.question + '</span>' +
        badge +
        '</div>' + expandHtml + '</div>';
    }).join('');
    if (data.total > data.qa.length) {
      list.innerHTML += '<div style="margin-top:8px"><a href="/qa?entity=' + slug + '" target="_blank" style="font-size:13px;color:var(--primary);text-decoration:none">→ 查看全部 ' + data.total + ' 条关联 #Q</a></div>';
    }
  } catch(e) {
    document.getElementById('entityQaList').innerHTML = '<span style="font-size:13px;color:#ef4444">加载失败</span>';
  }
}
loadEntityQa();
</script>
