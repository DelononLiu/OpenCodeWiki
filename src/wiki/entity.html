<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="entityTitle">实体详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.65;color:#1e293b;background:#fff;padding:32px;max-width:800px;margin:0 auto}
.entity-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.entity-header h1{font-size:24px}
.status-badge{font-size:11px;padding:2px 8px;border-radius:12px;background:#eef2ff;color:#2563eb}
.status-badge.filled{background:#ecfdf5;color:#059669}
.definition{color:#64748b;font-size:15px;margin-bottom:24px}
section{margin-bottom:24px}
section h3{font-size:14px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
#fileList{list-style:none}
#fileList li{padding:6px 0;font-size:13px;border-bottom:1px solid #f1f5f9}
#fileList code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:12px}
#entityContent{font-size:14px;line-height:1.7;margin-top:24px}
#entityContent h1,#entityContent h2,#entityContent h3{margin:16px 0 8px}
#entityContent p{margin:8px 0}
#entityContent code{background:#f1f5f9;padding:1px 4px;border-radius:3px}
#entityContent pre{background:#f8f9fb;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px}
.back-link{display:inline-block;margin-bottom:16px;color:#2563eb;text-decoration:none;font-size:13px}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<a class="back-link" href="/">&larr; 返回首页</a>
<div class="entity-header">
  <h1 id="entityName"></h1>
  <span class="status-badge" id="entityStatus"></span>
</div>
<p class="definition" id="entityDef"></p>

<section>
  <h3>涉及代码</h3>
  <ul id="fileList"></ul>
</section>

<section id="relationSection" style="display:none">
  <h3>上下游关系</h3>
  <ul id="relationList" style="list-style:none"></ul>
</section>

<section id="contentSection" style="display:none">
  <h3>详情</h3>
  <div id="entityContent"></div>
</section>

<script>
async function loadEntity() {
  const slug = location.pathname.split('/').pop();
  const r = await fetch('/api/wiki/entities/' + slug);
  if (!r.ok) { document.body.innerHTML = '<p style="padding:32px;color:red">实体未找到</p>'; return; }
  const e = await r.json();
  document.title = e.name + ' — 实体详情';
  document.getElementById('entityName').textContent = e.name;
  const badge = document.getElementById('entityStatus');
  badge.textContent = ({initial:'AI生成初版',calibrated:'已校准',filled:'已填充'})[e.status] || e.status;
  if (e.status === 'filled') badge.classList.add('filled');
  document.getElementById('entityDef').textContent = e.definition;

  if (e.files?.length) {
    document.getElementById('fileList').innerHTML = e.files.map(f =>
      '<li><code>' + f.path + '</code>' +
      (f.symbols?.length ? ' — ' + f.symbols.join(', ') : '') +
      '</li>'
    ).join('');
  }

  if (e.relations?.length) {
    document.getElementById('relationSection').style.display = '';
    document.getElementById('relationList').innerHTML = e.relations.map(r =>
      '<li>&bull; <a href="/wiki/entity/' + r.target + '" style="color:#2563eb;text-decoration:none">' + r.target + '</a> (' + r.type + ')</li>'
    ).join('');
  }

  if (e.content) {
    document.getElementById('contentSection').style.display = '';
    document.getElementById('entityContent').innerHTML = e.content.replace(/\n/g, '<br>');
  }
}
loadEntity();
</script>
</body>
</html>
